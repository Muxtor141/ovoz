include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 110
  trailing_commas: preserve

analyzer:
  exclude:
    - build/**
    - example/build/**
    - ios/**
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # A package must declare what it imports and never reach into another
    # package's src/ (the same rules the Mutolaa packages enforce).
    depend_on_referenced_packages: error
    implementation_imports: error
    unawaited_futures: error
    cancel_subscriptions: error
    close_sinks: error
    avoid_print: error

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - depend_on_referenced_packages
    - implementation_imports
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
